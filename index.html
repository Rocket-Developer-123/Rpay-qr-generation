<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPAY | POS QR Generator</title>
    <link rel="icon" id="favicon" href="data:,">
    <style>
        :root {
            --navy-900: #050f24;
            --navy-800: #081a3a;
            --navy-700: #0d2550;
            --navy-600: #16356b;
            --primary: #002970;
            --accent: #00b9f5;
            --accent-soft: rgba(0, 185, 245, 0.14);
            --ink: #04122b;
            --text: #eaf2ff;
            --muted: #93a7c9;
            --line: rgba(147, 167, 201, 0.22);
            --danger: #ff7a8a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        html { -webkit-text-size-adjust: 100%; background: var(--navy-900); }
        body {
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 50% -10%, rgba(0, 185, 245, 0.18), transparent 60%),
                linear-gradient(180deg, var(--navy-800), var(--navy-900));
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
        }

        header.brand {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 4px 22px;
        }
        header.brand img { width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line), 0 0 18px rgba(0, 185, 245, 0.35); }
        header.brand .name { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
        header.brand .tag { margin-left: auto; font-size: 12.5px; color: var(--muted); }

        .card {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(180deg, rgba(22, 53, 107, 0.55), rgba(13, 37, 80, 0.55));
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 26px 22px 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }
        .card h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
        .card .sub { font-size: 14.5px; line-height: 1.5; color: var(--muted); margin-bottom: 22px; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 7px; }
        .field .control { position: relative; }
        .field .prefix {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--muted); font-weight: 600; pointer-events: none;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(5, 15, 36, 0.6);
            color: var(--text);
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: #5c7096; }
        input.has-prefix { padding-left: 32px; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        input[aria-invalid="true"] { border-color: var(--danger); }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .error { min-height: 18px; font-size: 12.5px; color: var(--danger); margin-top: 6px; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .chip {
            padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
            background: transparent; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .chip:hover { background: var(--accent-soft); border-color: var(--accent); }

        .btn-primary {
            width: 100%; padding: 16px; margin-top: 6px;
            background: linear-gradient(135deg, #1fd0ff, #0a5bd1);
            color: #fff; border: none; border-radius: 14px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 185, 245, 0.28);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-primary:hover { box-shadow: 0 10px 30px rgba(0, 185, 245, 0.4); }
        .btn-primary:active { transform: scale(0.98); }
        :is(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Result */
        .result { display: none; margin-top: 26px; padding-top: 24px; border-top: 1px dashed var(--line); }
        .result.show { display: block; }

        .payload {
            background: var(--navy-900);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 15px;
            line-height: 1.6;
            color: var(--accent);
            word-break: break-all;
        }

        .qr-card {
            position: relative;
            margin: 18px auto 0;
            background: #fff;
            border-radius: 28px;
            padding: 22px;
            width: 100%;
            max-width: 340px;
            overflow: hidden;
        }
        .qr-card canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }

        /* Scan line: plays once each time a code is generated */
        .scan {
            position: absolute; left: 10px; right: 10px; top: 0; height: 56px; pointer-events: none;
            background: linear-gradient(180deg, transparent, rgba(0, 185, 245, 0.28) 55%, rgba(0, 185, 245, 0.75) 92%, rgba(255,255,255,0.9) 100%);
            border-bottom: 3px solid #35d8ff;
            box-shadow: 0 6px 18px rgba(0, 185, 245, 0.65);
            opacity: 0;
        }
        .qr-card.scanning .scan { animation: scan 1.4s ease-in-out 1; }
        @keyframes scan {
            0%   { transform: translateY(-60px); opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(var(--travel, 340px)); opacity: 0; }
        }

        .qr-details {
            margin: 18px auto 0; width: fit-content; max-width: 100%;
            font-size: 14px; font-weight: 600; color: #d8ecff;
            background: var(--accent-soft); border: 1px solid rgba(0, 185, 245, 0.35);
            padding: 10px 20px; border-radius: 999px; text-align: center; word-break: break-all;
        }
        .hint { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 12px; }

        .actions { display: flex; gap: 10px; margin-top: 18px; }
        .btn-ghost {
            flex: 1; padding: 13px 10px; border-radius: 12px; border: 1px solid var(--line);
            background: transparent; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .btn-ghost:hover { background: var(--accent-soft); border-color: var(--accent); }

        @media (prefers-reduced-motion: reduce) {
            .qr-card.scanning .scan { animation: none; }
        }
        @media print {
            body { background: #fff; color: #000; }
            header.brand, .card > *:not(.result), .actions, .payload, .hint { display: none !important; }
            .card { background: none; border: none; box-shadow: none; padding: 0; }
            .result { display: block; border: none; margin: 0; padding: 0; }
            .qr-details { color: #000; background: none; border-color: #000; }
        }
    </style>
</head>
<body>
    <div id="fatal" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#ff7a8a;color:#1a0005;padding:10px 14px;font:600 13px/1.4 sans-serif"></div>
    <noscript><p style="padding:16px;color:#fff">This page needs JavaScript turned on.</p></noscript>

    <header class="brand">
        <img id="brand-logo" src="rpay-logo.png" alt="RPAY">
        <span class="name">RPAY</span>
        <span class="tag">POS terminal</span>
    </header>

    <main class="card">
        <h1>Generate bill QR</h1>
        <p class="sub">Enter who is getting paid and the exact amount. The customer scans the code with the RPAY app.</p>

        <div class="field">
            <label for="target-upi">Receiver UPI ID</label>
            <div class="control">
                <input type="text" id="target-upi" placeholder="cafe@rpay" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="email">
            </div>
            <div class="error" id="upi-error" role="alert"></div>
        </div>

        <div class="field">
            <label for="bill-amount">Bill amount</label>
            <div class="control">
                <span class="prefix">₹</span>
                <input type="number" id="bill-amount" class="has-prefix" placeholder="480.00" min="0.01" step="0.01" inputmode="decimal">
            </div>
            <div class="chips" aria-label="Quick amounts">
                <button type="button" class="chip" data-amt="100">₹100</button>
                <button type="button" class="chip" data-amt="250">₹250</button>
                <button type="button" class="chip" data-amt="500">₹500</button>
                <button type="button" class="chip" data-amt="1000">₹1000</button>
            </div>
            <div class="error" id="amt-error" role="alert"></div>
        </div>

        <button class="btn-primary" id="generate-btn" type="button">Generate QR code</button>
        <div class="error" id="gen-error" role="alert"></div>

        <section id="qr-container" class="result" aria-live="polite">
            <div class="payload" id="payload-text"></div>

            <div class="qr-card" id="qr-card">
                <canvas id="qr-canvas" aria-label="Payment QR code"></canvas>
                <div class="scan" aria-hidden="true"></div>
            </div>

            <div class="qr-details" id="qr-text-label"></div>
            <p class="hint">Scan this with the RPAY app</p>

            <div class="actions">
                <button type="button" class="btn-ghost" id="download-btn">Download PNG</button>
                <button type="button" class="btn-ghost" id="copy-btn">Copy link</button>
                <button type="button" class="btn-ghost" id="print-btn">Print</button>
            </div>
        </section>
    </main>

    <script>
/* Minimal self-contained QR encoder: byte mode, error correction level H, versions 1-20. */
const QREnc = (function () {
    const ECC_PER_BLOCK = [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28];
    const NUM_BLOCKS    = [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25];
    const MAX_VERSION = 20;

    function rawModules(ver) {
        let r = (16 * ver + 128) * ver + 64;
        if (ver >= 2) {
            const na = Math.floor(ver / 7) + 2;
            r -= (25 * na - 10) * na - 55;
            if (ver >= 7) r -= 36;
        }
        return r;
    }
    function dataCodewords(ver) {
        return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];
    }
    function alignPositions(ver) {
        if (ver === 1) return [];
        const n = Math.floor(ver / 7) + 2;
        const size = ver * 4 + 17;
        const step = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
        const res = [6];
        for (let pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
        return res;
    }

    // GF(256) Reed-Solomon
    function gfMul(x, y) {
        let z = 0;
        for (let i = 7; i >= 0; i--) {
            z = (z << 1) ^ ((z >>> 7) * 0x11D);
            z ^= ((y >>> i) & 1) * x;
        }
        return z;
    }
    function rsDivisor(degree) {
        const res = [];
        for (let i = 0; i < degree - 1; i++) res.push(0);
        res.push(1);
        let root = 1;
        for (let i = 0; i < degree; i++) {
            for (let j = 0; j < res.length; j++) {
                res[j] = gfMul(res[j], root);
                if (j + 1 < res.length) res[j] ^= res[j + 1];
            }
            root = gfMul(root, 0x02);
        }
        return res;
    }
    function rsRemainder(data, divisor) {
        const res = divisor.map(() => 0);
        for (const b of data) {
            const factor = b ^ res.shift();
            res.push(0);
            divisor.forEach((coef, i) => (res[i] ^= gfMul(coef, factor)));
        }
        return res;
    }

    function utf8Bytes(text) {
        return Array.from(new TextEncoder().encode(text));
    }

    function encode(text, minVersion) {
        const bytes = utf8Bytes(text);
        let ver = minVersion || 1;
        for (; ver <= MAX_VERSION; ver++) {
            const ccBits = ver <= 9 ? 8 : 16;
            if (4 + ccBits + bytes.length * 8 <= dataCodewords(ver) * 8) break;
        }
        if (ver > MAX_VERSION) throw new Error("Text is too long for a QR code");

        // Bit stream
        const bits = [];
        const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
        push(0x4, 4);
        push(bytes.length, ver <= 9 ? 8 : 16);
        bytes.forEach((b) => push(b, 8));
        const capBits = dataCodewords(ver) * 8;
        push(0, Math.min(4, capBits - bits.length));
        push(0, (8 - (bits.length % 8)) % 8);
        for (let pad = 0xEC; bits.length < capBits; pad ^= 0xEC ^ 0x11) push(pad, 8);
        const data = [];
        for (let i = 0; i < bits.length; i += 8) {
            let v = 0;
            for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
            data.push(v);
        }

        // Split into blocks, add ECC, interleave
        const numBlocks = NUM_BLOCKS[ver], eccLen = ECC_PER_BLOCK[ver];
        const raw = Math.floor(rawModules(ver) / 8);
        const numShort = numBlocks - (raw % numBlocks);
        const shortLen = Math.floor(raw / numBlocks);
        const div = rsDivisor(eccLen);
        const blocks = [];
        for (let i = 0, k = 0; i < numBlocks; i++) {
            const dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
            k += dat.length;
            const ecc = rsRemainder(dat, div);
            if (i < numShort) dat.push(0);
            blocks.push(dat.concat(ecc));
        }
        const all = [];
        for (let i = 0; i < blocks[0].length; i++) {
            blocks.forEach((blk, j) => {
                if (i !== shortLen - eccLen || j >= numShort) all.push(blk[i]);
            });
        }

        // Matrix
        const size = ver * 4 + 17;
        const mod = Array.from({ length: size }, () => new Array(size).fill(false));
        const fn = Array.from({ length: size }, () => new Array(size).fill(false));
        const setFn = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
        const bit = (x, i) => ((x >>> i) & 1) !== 0;

        for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
        const finder = (cx, cy) => {
            for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
                const d = Math.max(Math.abs(dx), Math.abs(dy));
                const xx = cx + dx, yy = cy + dy;
                if (xx >= 0 && xx < size && yy >= 0 && yy < size) setFn(xx, yy, d !== 2 && d !== 4);
            }
        };
        finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
        const ap = alignPositions(ver), na = ap.length;
        for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
            if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
            for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
                setFn(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }

        const drawFormat = (mask) => {
            const d = (2 << 3) | mask;            // level H = 2
            let rem = d;
            for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const b = ((d << 10) | rem) ^ 0x5412;
            for (let i = 0; i <= 5; i++) setFn(8, i, bit(b, i));
            setFn(8, 7, bit(b, 6)); setFn(8, 8, bit(b, 7)); setFn(7, 8, bit(b, 8));
            for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(b, i));
            for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(b, i));
            for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(b, i));
            setFn(8, size - 8, true);
        };
        drawFormat(0);
        if (ver >= 7) {
            let rem = ver;
            for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            const b = (ver << 12) | rem;
            for (let i = 0; i < 18; i++) {
                const a = size - 11 + (i % 3), c = Math.floor(i / 3);
                setFn(a, c, bit(b, i)); setFn(c, a, bit(b, i));
            }
        }

        // Place codewords
        let idx = 0;
        for (let right = size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;
            for (let vert = 0; vert < size; vert++) {
                for (let j = 0; j < 2; j++) {
                    const x = right - j;
                    const upward = ((right + 1) & 2) === 0;
                    const y = upward ? size - 1 - vert : vert;
                    if (!fn[y][x] && idx < all.length * 8) {
                        mod[y][x] = bit(all[idx >>> 3], 7 - (idx & 7));
                        idx++;
                    }
                }
            }
        }

        const maskFn = [
            (x, y) => (x + y) % 2 === 0,
            (x, y) => y % 2 === 0,
            (x, y) => x % 3 === 0,
            (x, y) => (x + y) % 3 === 0,
            (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
            (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
            (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
            (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0
        ];
        const applyMask = (m) => {
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
                if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x];
        };

        const penalty = () => {
            let p = 0;
            const lines = [];
            for (let y = 0; y < size; y++) lines.push(mod[y]);
            for (let x = 0; x < size; x++) lines.push(mod.map((r) => r[x]));
            for (const line of lines) {
                let run = 1;
                for (let i = 1; i <= size; i++) {
                    if (i < size && line[i] === line[i - 1]) run++;
                    else { if (run >= 5) p += run - 2; run = 1; }
                }
                const s = line.map((v) => (v ? "1" : "0")).join("");
                for (const pat of ["10111010000", "00001011101"]) {
                    let at = s.indexOf(pat);
                    while (at !== -1) { p += 40; at = s.indexOf(pat, at + 1); }
                }
            }
            for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
                const c = mod[y][x];
                if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
            }
            let dark = 0;
            for (const r of mod) for (const v of r) if (v) dark++;
            p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
            return p;
        };

        let best = 0, bestP = Infinity;
        for (let m = 0; m < 8; m++) {
            applyMask(m); drawFormat(m);
            const p = penalty();
            if (p < bestP) { bestP = p; best = m; }
            applyMask(m);             // undo
        }
        applyMask(best); drawFormat(best);
        return { size, version: ver, modules: mod, isFunction: fn };
    }

    return { encode };
})();
    </script>
    <script>
        // KINEX coin logo: embedded once in the header <img>; reused for the QR and favicon
        const LOGO_SRC = document.getElementById('brand-logo').src;
        document.getElementById('favicon').href = LOGO_SRC;

        // QR colours
        const INK = "#04122b";       // module colour (deep navy, as in the RPAY site)
        const PAPER = "#ffffff";

        window.addEventListener('error', (e) => {
            const f = document.getElementById('fatal');
            f.style.display = 'block';
            f.textContent = 'Error: ' + e.message;
        });

        const $ = (id) => document.getElementById(id);
        const upiInput = $('target-upi');
        const amtInput = $('bill-amount');
        let currentPayload = "";

        // Preload logo
        const logoImg = new Image();
        const logoReady = new Promise((resolve) => {
            logoImg.onload = () => resolve(true);
            logoImg.onerror = () => resolve(false);
        });
        logoImg.src = LOGO_SRC;

        // Build the QR matrix with the built-in encoder (level H leaves room for the centre logo)
        function buildMatrix(text) {
            return QREnc.encode(text, 4).modules;   // start at version 4 so the logo covers a small share of the code
        }

        async function drawQR(text) {
            const matrix = buildMatrix(text);
            const n = matrix.length;
            const cell = 20;                 // px per module on the canvas
            const quiet = 1;                 // small margin inside the canvas; card padding adds the rest
            const size = (n + quiet * 2) * cell;

            const canvas = $('qr-canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = PAPER;
            ctx.fillRect(0, 0, size, size);

            // Centre logo geometry (about 22% of the code width)
            const cx = size / 2, cy = size / 2;
            const logoR = size * 0.105;
            const clearR = logoR + cell * 0.9;   // empty ring around the logo, like the RPAY site

            ctx.fillStyle = INK;
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    if (!matrix[r][c]) continue;
                    const x = (c + quiet) * cell;
                    const y = (r + quiet) * cell;
                    // skip modules that fall under the logo
                    const mx = x + cell / 2, my = y + cell / 2;
                    if (Math.hypot(mx - cx, my - cy) < clearR) continue;
                    ctx.fillRect(x, y, cell, cell);
                }
            }

            // Logo
            const ok = await logoReady;
            if (ok) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, logoR + cell * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = PAPER;
                ctx.fill();
                ctx.restore();
                ctx.drawImage(logoImg, cx - logoR, cy - logoR, logoR * 2, logoR * 2);
            }
        }

        function setError(id, input, msg) {
            $(id).textContent = msg;
            if (input) input.setAttribute('aria-invalid', msg ? 'true' : 'false');
        }

        async function generatePOSQR() {
            const upiId = upiInput.value.trim();
            const amountNum = parseFloat(amtInput.value);
            let valid = true;

            if (!/^[A-Za-z0-9._-]{2,}@[A-Za-z0-9]{2,}$/.test(upiId)) {
                setError('upi-error', upiInput, "Enter a UPI ID like cafe@rpay.");
                valid = false;
            } else setError('upi-error', upiInput, "");

            if (!isFinite(amountNum) || amountNum <= 0) {
                setError('amt-error', amtInput, "Enter an amount greater than 0.");
                valid = false;
            } else setError('amt-error', amtInput, "");

            if (!valid) return;

            const amount = amountNum.toFixed(2);
            // Format exactly as RPAY expects it: upi://pay?pa=cafe@rpay&am=480.00
            currentPayload = `upi://pay?pa=${upiId}&am=${amount}`;

            await drawQR(currentPayload);

            $('payload-text').textContent = currentPayload;
            $('qr-text-label').textContent = `Paying ₹${amount} to ${upiId}`;
            $('qr-container').classList.add('show');

            // replay the scan line
            const card = $('qr-card');
            card.style.setProperty('--travel', (card.clientHeight - 56) + 'px');
            card.classList.remove('scanning');
            void card.offsetWidth;
            card.classList.add('scanning');

            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function downloadPNG() {
            const canvas = $('qr-canvas');
            // Add a white frame so the saved image scans well anywhere
            const pad = 60;
            const out = document.createElement('canvas');
            out.width = canvas.width + pad * 2;
            out.height = canvas.height + pad * 2;
            const ctx = out.getContext('2d');
            ctx.fillStyle = PAPER;
            ctx.fillRect(0, 0, out.width, out.height);
            ctx.drawImage(canvas, pad, pad);
            const a = document.createElement('a');
            a.download = `rpay-qr-${upiInput.value.trim().replace(/[^A-Za-z0-9._-]/g, '_')}.png`;
            a.href = out.toDataURL('image/png');
            a.click();
        }

        async function copyLink() {
            const btn = $('copy-btn');
            try {
                await navigator.clipboard.writeText(currentPayload);
                btn.textContent = "Copied";
            } catch (e) {
                btn.textContent = "Copy failed";
            }
            setTimeout(() => (btn.textContent = "Copy link"), 1500);
        }

        $('generate-btn').addEventListener('click', async () => {
            $('gen-error').textContent = "";
            try { await generatePOSQR(); }
            catch (e) { $('gen-error').textContent = "Could not generate the QR code: " + e.message; }
        });
        $('download-btn').addEventListener('click', downloadPNG);
        $('copy-btn').addEventListener('click', copyLink);
        $('print-btn').addEventListener('click', () => window.print());
        document.querySelectorAll('.chip').forEach((chip) =>
            chip.addEventListener('click', () => { amtInput.value = chip.dataset.amt; amtInput.focus(); })
        );
        [upiInput, amtInput].forEach((el) =>
            el.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('generate-btn').click(); })
        );
    </script>
</body>
</html>
